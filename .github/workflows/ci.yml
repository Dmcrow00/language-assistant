# CI de Fonética RP: la interfaz y Electron (Node 22) y el motor Java (Java 25, sidecar-java/).
#
# Qué hace en cada push y PR a develop y main:
#   node  → ESLint, tests de Angular, build, tests de Electron y que study-data.json esté al día.
#   java  → instala dmc00-parent (versión fijada abajo), compila el motor y corre sus tests (JUnit, sin red,
#           sin voz ni spaCy: esas pruebas se saltean). Después corre los tests de Electron contra el jar
#           recién compilado (contrato de punta a punta).
# El instalador de Windows no se arma acá (baja la voz de 114 MB y empaqueta spaCy): ver
# docs/guia-entorno-local-y-despliegue.md.
#
# Secret necesario mientras dmc00-parent sea privado (Settings → Secrets and variables → Actions):
#   CROSS_REPO_PAT - token con permiso de lectura de contenido sobre Dmcrow00/dmc00-parent.
# Sin él, el job "java" falla en el checkout de dmc00-parent ("Repository not found").

name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # develop de dmc00-parent (sin tags todavía; trae ONNX Runtime, #5). Nunca la rama por defecto.
  DMC00_PARENT_REF: develop
  # Los tests no abren Electron: no hace falta bajar su binario.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # El mismo npm con el que se generó package-lock.json (campo packageManager): el npm 10 que trae Node 22
      # no acepta un lock escrito por npm 11 (peer dependencies opcionales de @napi-rs/wasm-runtime).
      - name: npm de package.json
        run: npm install -g "$(node -p "require('./package.json').packageManager")"

      - name: Dependencias
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Tests de Angular
        run: npm test

      - name: Build (Angular + Electron)
        run: npm run build

      - name: Tests de Electron
        run: npm run test:electron

      - name: study-data.json al día con shared/study-data
        run: |
          node scripts/export-study-data.mjs
          git diff --exit-code -- sidecar-java/src/test/resources/study-data.json

  java:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Checkout de dmc00-parent
        uses: actions/checkout@v7
        with:
          repository: Dmcrow00/dmc00-parent
          ref: ${{ env.DMC00_PARENT_REF }}
          token: ${{ secrets.CROSS_REPO_PAT || github.token }}
          path: _dmc00-parent

      - name: Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: dmc00-parent en el repositorio Maven local
        working-directory: _dmc00-parent
        run: ./mvnw -B -ntp -q install -N

      - name: Compilar y correr los tests del motor
        working-directory: sidecar-java
        run: ./mvnw -B -ntp verify

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # El mismo npm con el que se generó package-lock.json (campo packageManager): el npm 10 que trae Node 22
      # no acepta un lock escrito por npm 11 (peer dependencies opcionales de @napi-rs/wasm-runtime).
      - name: npm de package.json
        run: npm install -g "$(node -p "require('./package.json').packageManager")"

      - name: Tests de Electron contra el motor compilado
        run: |
          npm ci
          npm run test:electron

      - name: Reportes de tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-de-tests
          path: sidecar-java/target/surefire-reports/
          retention-days: 7

      - name: Cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: sidecar-java/target/site/jacoco/
          retention-days: 14
